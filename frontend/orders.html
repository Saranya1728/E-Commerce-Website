<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script src="navbar.js"></script>

    <div class="orders-container">
        <h2>My Orders</h2>
        <div id="ordersList"></div>
    </div>

    <script>
        const userId = getLoggedInUserId();

        async function loadOrders() {
            const container = document.getElementById("ordersList");

            if (!userId) {
                container.innerHTML = "<p class='orders-empty'>Please log in to view your orders.</p>";
                return;
            }

            const ordersResponse = await fetch(`http://localhost:8080/api/orders/${userId}`);
            const orders = await ordersResponse.json();

            if (orders.length === 0) {
                container.innerHTML = "<p class='orders-empty'>You haven't placed any orders yet.</p>";
                return;
            }

            container.innerHTML = "";

            for (const order of orders) {
                const itemsResponse = await fetch(`http://localhost:8080/api/orders/items/${order.id}`);
                const items = await itemsResponse.json();

                let itemsHTML = "";
                for (const item of items) {
                    const productResponse = await fetch(`http://localhost:8080/api/products/${item.productId}`);
                    const product = await productResponse.json();
                    itemsHTML += `<p class="order-item-line">${product.name} × ${item.quantity} — ₹${item.price * item.quantity}</p>`;
                }

                const orderDiv = document.createElement("div");
                orderDiv.className = "order-card";
                orderDiv.innerHTML = `
                    <h3>Order #${order.id}</h3>
                    <span class="order-status">${order.status}</span>
                    <p class="order-date">${new Date(order.orderDate).toLocaleString()}</p>
                    <hr>
                    ${itemsHTML}
                    <p class="order-total">Total: ₹${order.totalAmount}</p>
                `;
                container.appendChild(orderDiv);
            }
        }

        loadOrders();
    </script>

    <script src="footer.js"></script>
</body>
</html>

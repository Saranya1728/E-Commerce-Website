<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script src="navbar.js"></script>

    <div class="cart-container">
        <h2>My Cart</h2>
        <div id="cartList"></div>
        <div class="cart-summary">
            <span class="total-text" id="totalPrice"></span>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <script>
        const userId = getLoggedInUserId();

        async function loadCart() {
            if (!userId) {
                document.getElementById("cartList").innerHTML = "<p class='cart-empty'>Please log in to view your cart.</p>";
                document.getElementById("totalPrice").innerText = "";
                return;
            }

            const cartResponse = await fetch(`http://localhost:8080/api/cart/${userId}`);
            const cartItems = await cartResponse.json();

            const container = document.getElementById("cartList");
            container.innerHTML = "";
            let total = 0;

            if (cartItems.length === 0) {
                container.innerHTML = "<p class='cart-empty'>Your cart is empty.</p>";
                document.getElementById("totalPrice").innerText = "";
                return;
            }

            for (const item of cartItems) {
                const productResponse = await fetch(`http://localhost:8080/api/products/${item.productId}`);
                const product = await productResponse.json();

                const itemTotal = product.price * item.quantity;
                total += itemTotal;

                const div = document.createElement("div");
                div.className = "cart-item";
                div.innerHTML = `
                    <div class="cart-item-details">
                        <h3>${product.name}</h3>
                        <p>Price: ₹${product.price}</p>
                        <p>Quantity: ${item.quantity}</p>
                        <p class="subtotal">Subtotal: ₹${itemTotal}</p>
                    </div>
                    <button class="cart-remove-btn" onclick="removeItem(${item.id})">Remove</button>
                `;
                container.appendChild(div);
            }

            document.getElementById("totalPrice").innerText = `Total: ₹${total}`;
        }

        function removeItem(cartItemId) {
            fetch(`http://localhost:8080/api/cart/${cartItemId}`, {
                method: "DELETE"
            })
            .then(() => loadCart());
        }

        function checkout() {
            if (!userId) {
                alert("Please log in first.");
                return;
            }
            fetch(`http://localhost:8080/api/orders/checkout/${userId}`, {
                method: "POST"
            })
            .then(res => res.json())
            .then(order => {
                alert(`Order placed! Order ID: ${order.id}, Total: ₹${order.totalAmount}`);
                loadCart();
            });
        }

        loadCart();
    </script>

    <script src="footer.js"></script>
</body>
</html>

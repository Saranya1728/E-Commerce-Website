<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Login to continue shopping</p>

            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="loginUser()" class="auth-btn">Login</button>
            <p id="message" class="auth-message"></p>

            <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script>
        function loginUser() {
            const user = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            fetch("http://localhost:8080/api/users/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(user)
            })
            .then(response => response.json())
            .then(data => {
                if (data === null) {
                    document.getElementById("message").innerText = "Invalid email or password.";
                } else {
                    localStorage.setItem("loggedInUser", JSON.stringify(data));
                    document.getElementById("message").innerText = "Login successful! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("message").innerText = "Something went wrong.";
            });
        }
    </script>
    <script src="footer.js"></script>
</body>
</html>
